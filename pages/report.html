<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Anónimo - SafePulse</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <h1>Reporte Seguro y Confidencial</h1>
    <form id="formularioReporte">
    <label for="anonimo">
        <input type="checkbox" id="anonimo"> Enviar de forma anónima
    </label>
    <br><br>
    <label for="descripcion">Detalle de la situación:</label>
    <textarea id="descripcion" placeholder="Describe la situación de ciberacoso..." required></textarea>
    <br><br>
    <button type="submit" aria-label="Enviar reporte de ciberacoso">Enviar Reporte</button>
</form>
<p id="mensajeExito" style="display:none; color: green; font-weight: bold;">¡Reporte enviado de forma segura!</p>
</body>
</html>
